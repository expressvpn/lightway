---
server: server:27690
mode: tcp
ca_cert: "tests/certs/ca.crt"
tun:
  name: lightway
  local_ip: 100.64.0.6
  peer_ip: 100.64.0.5
  dns_ip: 100.64.0.1
  iouring:
    enabled: false
    entry_count: 1024
    # sqpoll_idle_time: 100ms
log:
  level: info
server_dn: goaway.com
user: user
password: password
outside_mtu: 1500
cipher: aes256
# keyshare: x25519mlkem768
keepalive:
  interval: 10s
  timeout: 30s
  continuous: true
expresslane:
  enabled: false
pmtud:
  enabled: false
# socket:
#   sndbuf: 1.5 MiB
#   rcvbuf: 1.5 MiB
network:
  route_mode: default
  dns_config_mode: noexec
