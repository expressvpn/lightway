---
servers:
  - server: server_udp:27690
    mode: udp
    server_dn: goaway.com
    cipher: aes256
  - server: server_tcp:27690
    mode: tcp
    server_dn: goaway.com
    cipher: aes256
ca_cert: "tests/certs/ca.crt"
tun:
  name: lightway
  local_ip: 100.64.0.6
  peer_ip: 100.64.0.5
  dns_ip: 100.64.0.1
  iouring:
    enabled: false
    entry_count: 1024
    # sqpoll_idle_time: 100ms
log:
  level: info
user: user
password: password
outside_mtu: 1500
keepalive:
  interval: 10s
  timeout: 60s
pmtud:
  enabled: false
# socket:
#   sndbuf: 1.5 MiB
#   rcvbuf: 1.5 MiB
network:
  route_mode: default
  dns_config_mode: noexec
preferred_connection_wait_interval: 2s
