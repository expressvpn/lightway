name: Nix Build and Test

on:
  workflow_dispatch:
  schedule:
    # Run daily at 18:00 UTC
    - cron: '0 18 * * *'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_name != 'main' }}

jobs:
  x86_64-linux:
    uses: ./.github/workflows/nix-build-x86_64-linux.yaml

  aarch64-linux:
    uses: ./.github/workflows/nix-build-aarch64-linux.yaml

  macos:
    uses: ./.github/workflows/nix-build-macos.yaml

  verify-builds:
    name: Verify All Builds
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [x86_64-linux, aarch64-linux, macos]
    if: always()  # Run even if some builds failed
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v8.0.1
        with:
          path: artifacts/

      - name: Display build summary
        run: |
          echo "=== Build Summary ==="
          echo ""
          echo "Total artifacts:"
          ls -1 artifacts/ | wc -l
          echo ""
          echo "=== All Built Packages ==="
          ls -1 artifacts/ | sort
          echo ""
          echo "=== Binary Details ==="
          find artifacts -type f | while read -r f; do
            if file "$f" | grep -q "ELF"; then
              echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
              echo "Package: $(basename $(dirname $f))"
              echo "Binary: $(basename $f)"
              file "$f" | sed 's/^/  /'
            fi
          done
          echo ""
          echo "✅ All builds completed successfully!"
