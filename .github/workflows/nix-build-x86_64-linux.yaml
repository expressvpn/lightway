name: Nix build / x86_64-linux

on:
  workflow_call:

jobs:
  build:
    name: ${{ matrix.package }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - package: lightway-x86_64-linux-gnu
            verify_type: "dynamically linked"
            build_type: "native"
          - package: lightway-x86_64-linux-gnu-msrv
            verify_type: "dynamically linked"
            build_type: "native"
          - package: lightway-x86_64-linux-musl
            verify_type: "static-pie linked"
            build_type: "native"
          - package: lightway-aarch64-linux-musl
            verify_type: "musl-static"
            build_type: "cross"
          - package: lightway-aarch64-linux-gnu
            verify_type: "dynamically linked"
            build_type: "cross"

    steps:
      - uses: actions/checkout@v7.0.1

      - uses: ./.github/actions/nix-build
        with:
          package: ${{ matrix.package }}
          platform: x86_64-linux
          build_type: ${{ matrix.build_type }}
          verify_type: ${{ matrix.verify_type }}
