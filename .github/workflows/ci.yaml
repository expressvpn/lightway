# .github/workflows/ci.yml
name: CI
on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress:  ${{ github.ref_name != 'main' }}

jobs:
  ci:
    needs: [build-linux, e2e, nix, windows, coverage]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - shell: bash
        run: |
          [[ $(echo '${{ toJSON(needs) }}' | jq 'map(select(.result != "success")) | length == 0') == 'true' ]] || exit 1
  build-linux:
    uses: ./.github/workflows/ci-build-linux.yaml

  e2e:
    uses: ./.github/workflows/ci-e2e.yaml

  nix:
    uses: ./.github/workflows/ci-nix.yaml

  windows:
    uses: ./.github/workflows/ci-windows.yaml

  coverage:
    runs-on: ubuntu-latest
    env:
      FORCE_COLOR: 1
    steps:
      - uses: earthly/actions-setup@43211c7a0eae5344d6d79fb4aaf209c8f8866203 # v1
        with:
          version: ~v0.8
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/checkout@v7.0.1
        with:
          submodules: recursive
      - name: Run +coverage on Earthly
        id: coverage
        run: |
          earthly --ci --allow-privileged --artifact +coverage/* output/

          cat output/summary.txt

          EOF=$(dd if=/dev/urandom bs=15 count=1 status=none | base64)
          echo "summary<<$EOF"    >> "$GITHUB_OUTPUT"
          cat output/summary.txt  >> "$GITHUB_OUTPUT"
          echo ""                 >> "$GITHUB_OUTPUT"
          echo "$EOF"             >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: coverage
          path: output/html
          if-no-files-found: error
      - name: Check coverage
        id: coverage-check
        run: |
          REGIONS_SOFT_THRESHOLD=50
          REGIONS_HARD_THRESHOLD=40
          LINES_SOFT_THRESHOLD=60
          LINES_HARD_THRESHOLD=50

          regions_coverage=$(jq '.data[].totals.regions.percent | floor' output/coverage.json)
          lines_coverage=$(jq '.data[].totals.lines.percent | floor' output/coverage.json)

          echo "Regions: $regions_coverage% (soft: $REGIONS_SOFT_THRESHOLD%, hard: $REGIONS_HARD_THRESHOLD%)"
          echo "Lines: $lines_coverage% (soft: $LINES_SOFT_THRESHOLD%, hard: $LINES_HARD_THRESHOLD%)"

          FAILED=false

          EOF=$(dd if=/dev/urandom bs=15 count=1 status=none | base64)
          echo "text<<$EOF" >> "$GITHUB_OUTPUT"

          if [[ $regions_coverage -lt $REGIONS_HARD_THRESHOLD ]] ; then
              echo ":x: Region coverage $regions_coverage% below hard threshold $REGIONS_HARD_THRESHOLD%" >> "$GITHUB_OUTPUT"
              FAILED=true
          elif [[ $regions_coverage -lt $REGIONS_SOFT_THRESHOLD ]] ; then
              echo ":warning: Region coverage $regions_coverage% below soft threshold $REGIONS_SOFT_THRESHOLD%" >> "$GITHUB_OUTPUT"
          else
              echo ":white_check_mark: Region coverage $regions_coverage% passes" >> "$GITHUB_OUTPUT"
          fi

          if [[ $lines_coverage -lt $LINES_HARD_THRESHOLD ]] ; then
              echo ":x: Line coverage $lines_coverage% below hard threshold $LINES_HARD_THRESHOLD%" >> "$GITHUB_OUTPUT"
              FAILED=true
          elif [[ $lines_coverage -lt $LINES_SOFT_THRESHOLD ]] ; then
              echo ":warning: Line coverage $lines_coverage% below soft threshold $LINES_SOFT_THRESHOLD%" >> "$GITHUB_OUTPUT"
          else
              echo ":white_check_mark: Line coverage $lines_coverage% passes" >> "$GITHUB_OUTPUT"
          fi

          echo "$EOF" >> "$GITHUB_OUTPUT"

          echo "Setting output: failed: $FAILED"
          echo "failed=$FAILED" >> "$GITHUB_OUTPUT"

      - uses: jwalton/gh-find-current-pr@f3d61b485d2801773f7a07b2aaa3306bd8f8e653 # v1
        id: find-pr
        with:
          state: open
      - name: Find Coverage Comment
        if: steps.find-pr.outputs.number
        uses: peter-evans/find-comment@b30e6a3c0ed37e7c023ccd3f1db5c6c0b0c23aad # v4.0.0
        id: coverage-comment
        with:
          issue-number: ${{ steps.find-pr.outputs.number }}
          comment-author: 'github-actions[bot]'
          body-includes: 'Code coverage summary'
      - name: Create or update comment
        if: steps.find-pr.outputs.number
        uses: peter-evans/create-or-update-comment@e8674b075228eee787fea43ef493e45ece1004c9 # v5.0.0
        with:
          comment-id: ${{ steps.coverage-comment.outputs.comment-id }}
          issue-number: ${{ steps.find-pr.outputs.number }}
          body: |
            [Code coverage summary](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}) for ${{ github.sha }}:
            ```
            ${{ steps.coverage.outputs.summary }}
            ```
            ${{ steps.coverage-check.outputs.text }}
          edit-mode: replace
      - name: Coverage check fails
        if: steps.coverage-check.outputs.failed == 'true'
        run: exit 1

  nightly-release:
    name: Nightly Release
    runs-on: ubuntu-latest
    needs: [ci]
    if: github.ref == 'refs/heads/main'
    concurrency:
      group: nightly-release
      cancel-in-progress: true
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          submodules: recursive

      - name: Download all artifacts
        uses: actions/download-artifact@v8.0.1
        with:
          path: artifacts/

      - name: Display structure of downloaded artifacts
        run: ls -R artifacts/

      - name: Prepare release assets
        run: |
          mkdir -p release-assets

          cp artifacts/lightway-client-x86_64-unknown-linux-gnu-wolfssl/lightway-client release-assets/lightway-client-x86_64-unknown-linux-gnu-wolfssl
          cp artifacts/lightway-server-x86_64-unknown-linux-gnu-wolfssl/lightway-server release-assets/lightway-server-x86_64-unknown-linux-gnu-wolfssl
          cp artifacts/lightway-client-aarch64-unknown-linux-gnu-wolfssl/lightway-client release-assets/lightway-client-aarch64-unknown-linux-gnu-wolfssl
          cp artifacts/lightway-server-aarch64-unknown-linux-gnu-wolfssl/lightway-server release-assets/lightway-server-aarch64-unknown-linux-gnu-wolfssl
          cp artifacts/lightway-client-riscv64gc-unknown-linux-gnu-wolfssl/lightway-client release-assets/lightway-client-riscv64gc-unknown-linux-gnu-wolfssl
          cp artifacts/lightway-server-riscv64gc-unknown-linux-gnu-wolfssl/lightway-server release-assets/lightway-server-riscv64gc-unknown-linux-gnu-wolfssl

          cp artifacts/lightway-client-x86_64-unknown-linux-gnu-boringssl-beta/lightway-client release-assets/lightway-client-x86_64-unknown-linux-gnu-boringssl-beta
          cp artifacts/lightway-server-x86_64-unknown-linux-gnu-boringssl-beta/lightway-server release-assets/lightway-server-x86_64-unknown-linux-gnu-boringssl-beta
          cp artifacts/lightway-client-aarch64-unknown-linux-gnu-boringssl-beta/lightway-client release-assets/lightway-client-aarch64-unknown-linux-gnu-boringssl-beta
          cp artifacts/lightway-server-aarch64-unknown-linux-gnu-boringssl-beta/lightway-server release-assets/lightway-server-aarch64-unknown-linux-gnu-boringssl-beta
          cp artifacts/lightway-client-riscv64gc-unknown-linux-gnu-boringssl-beta/lightway-client release-assets/lightway-client-riscv64gc-unknown-linux-gnu-boringssl-beta
          cp artifacts/lightway-server-riscv64gc-unknown-linux-gnu-boringssl-beta/lightway-server release-assets/lightway-server-riscv64gc-unknown-linux-gnu-boringssl-beta

          cp artifacts/lightway-client-aarch64-darwin-wolfssl/lightway-client release-assets/lightway-client-aarch64-darwin-wolfssl
          cp artifacts/lightway-server-aarch64-darwin-wolfssl/lightway-server release-assets/lightway-server-aarch64-darwin-wolfssl

          cp artifacts/lightway-client-aarch64-darwin-boringssl-beta/lightway-client release-assets/lightway-client-aarch64-darwin-boringssl-beta
          cp artifacts/lightway-server-aarch64-darwin-boringssl-beta/lightway-server release-assets/lightway-server-aarch64-darwin-boringssl-beta

          cp artifacts/lightway-client-x86_64-pc-windows-msvc-wolfssl/lightway-client.exe release-assets/lightway-client-x86_64-pc-windows-msvc-wolfssl.exe
          cp artifacts/lightway-client-aarch64-pc-windows-msvc-wolfssl/lightway-client.exe release-assets/lightway-client-aarch64-pc-windows-msvc-wolfssl.exe
          cp artifacts/lightway-client-x86_64-pc-windows-msvc-boringssl-beta/lightway-client.exe release-assets/lightway-client-x86_64-pc-windows-msvc-boringssl-beta.exe
          cp artifacts/lightway-client-aarch64-pc-windows-msvc-boringssl-beta/lightway-client.exe release-assets/lightway-client-aarch64-pc-windows-msvc-boringssl-beta.exe
          cp artifacts/lightway-android-aar/lightway-release.aar release-assets/lightway-release.aar
          cp artifacts/lightway-client-jsonschema/client.schema.json release-assets/client.schema.json

          chmod +x release-assets/*

      - name: Create nightly release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: lightway-nightly
          name: Nightly Build
          prerelease: true
          body: |
            Automated nightly build from commit ${{ github.sha }}

            Build date: ${{ github.event.head_commit.timestamp }}

            ## Artifacts
            This release includes pre-built binaries for:
            - **Linux** (x86_64, aarch64, riscv64): lightway-client and lightway-server
            - **macOS** (aarch64): lightway-client and lightway-server
            - **Windows** (x86_64, aarch64): lightway-client only
            - **Android**: AAR library and client JSON schema
          files: release-assets/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
