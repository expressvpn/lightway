[package]
name = "lightway-offload-engine"
description = "Out-of-process ExpressLane data-plane engine"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
rust-version.workspace = true

# NOT `workspace = true`: SCM_RIGHTS needs unsafe. Every other workspace lint
# is restated, and undocumented_unsafe_blocks stays denied.
[lints.rust]
unsafe_op_in_unsafe_fn = "deny"
unused_unsafe = "deny"

[lints.clippy]
undocumented_unsafe_blocks = "deny"
missing_safety_doc = "deny"
multiple_unsafe_ops_per_block = "deny"
unnecessary_safety_comment = "deny"

[[bin]]
name = "lightway-offload-engine"
path = "src/bin/engine.rs"

[[bin]]
name = "lightway-offload-client"
path = "src/bin/client.rs"

[dependencies]
bytes.workspace = true
# The client binary translates lightway-core's expresslane callbacks into
# control messages, and engine.rs's own tests check the header bytes it builds
# against the real serializer rather than trusting a hand-rolled copy.
lightway-core = { path = "../lightway-core", version = "0.1.0" }
lightway-expresslane = { path = "../lightway-expresslane", version = "0.1.0", features = ["wolfssl-backend"] }
rand.workspace = true
tracing.workspace = true
tracing-subscriber = { workspace = true, features = ["env-filter"] }

# Linux-only, like the steering crate: the client binary is a stub off Linux,
# so nothing outside this target needs the VPN stack or a tokio runtime.
[target.'cfg(target_os = "linux")'.dependencies]
anyhow.workspace = true
clap.workspace = true
libc.workspace = true
lightway-app-utils.workspace = true
lightway-bpf-steering = { path = "../lightway-bpf-steering", version = "0.1.0" }
lightway-client = { path = "../lightway-client", version = "0.1.0" }
tokio.workspace = true
