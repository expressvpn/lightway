[package]
name = "lightway-offload-engine"
description = "Out-of-process ExpressLane data-plane engine"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
rust-version.workspace = true

# NOT `workspace = true`: SCM_RIGHTS needs unsafe. Every other workspace lint
# is restated, and undocumented_unsafe_blocks stays denied.
[lints.rust]
unsafe_op_in_unsafe_fn = "deny"
unused_unsafe = "deny"

[lints.clippy]
undocumented_unsafe_blocks = "deny"
missing_safety_doc = "deny"
multiple_unsafe_ops_per_block = "deny"
unnecessary_safety_comment = "deny"

[[bin]]
name = "lightway-offload-engine"
path = "src/bin/engine.rs"

[dependencies]
bytes.workspace = true
lightway-expresslane = { path = "../lightway-expresslane", version = "0.1.0", features = ["wolfssl-backend"] }
rand.workspace = true
tracing.workspace = true
tracing-subscriber = { workspace = true, features = ["env-filter"] }

[target.'cfg(target_os = "linux")'.dependencies]
libc.workspace = true
lightway-bpf-steering = { path = "../lightway-bpf-steering", version = "0.1.0" }

# Test targets get [dependencies] as well as these, so only what tests alone
# need belongs here. lightway-core lets engine.rs's own tests check header
# bytes against the real serializer instead of trusting that a hand-rolled
# copy still matches; nothing else depends on it.
[dev-dependencies]
lightway-core = { path = "../lightway-core", version = "0.1.0" }
