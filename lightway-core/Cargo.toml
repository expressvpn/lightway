[package]
name = "lightway-core"
version = "0.1.0"
repository.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
readme = "README.md"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[features]
default = ["wolfssl"]
# Enable additional APIs to support wire protocol fuzzing
fuzzing_api = []
wolfssl = ["dep:wolfssl", "wolfssl/system_ca_certs"]
boringssl = ["dep:boringssl"]
debug = ["wolfssl?/debug", "boringssl?/debug"]
postquantum = ["wolfssl?/postquantum"]

[lints]
workspace = true

[dependencies]
anyhow.workspace = true
bitfield-struct = "0.13.0"
bytes.workspace = true
delegate.workspace = true
lightway-expresslane = { version = "0.1.0", path = "../lightway-expresslane" }
lru = "0.18.0"
metrics.workspace = true
more-asserts.workspace = true
num_enum = "0.7.0"
once_cell = "1.19.0"
parking_lot.workspace = true
pnet_packet.workspace = true
rand.workspace = true
rand_core = "0.10.0"
thiserror.workspace = true
tracing.workspace = true
wolfssl = { version = "7.0.0", optional = true }
boringssl = { path = "../lightway-boring", package = "lightway-boring", optional = true }

[build-dependencies]
cfg_aliases = "0.2.1"

[dev-dependencies]
async-trait.workspace = true
cfg-if = "1.0.4"
itertools = "0.14.0"
lightway-app-utils.workspace = true
test-case.workspace = true
tokio.workspace = true
tokio-stream.workspace = true
socket2.workspace = true
pnet.workspace = true
